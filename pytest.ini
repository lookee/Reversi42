[pytest]
# Pytest configuration for Reversi42

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async configuration
asyncio_mode = auto

# Markers
markers =
    asyncio: mark test as async
    e2e: mark test as end-to-end test
    slow: mark test as slow running
    integration: mark test as integration test
    unit: mark test as unit test
    webgui: mark test as webgui test
    backend: mark test as backend test
    frontend: mark test as frontend test
    observer: mark test as observer test

# Output
addopts = 
    -ra
    --strict-markers
    --strict-config
    --showlocals

# Coverage
[coverage:run]
source = src
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
relative_files = True

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov

