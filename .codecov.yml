codecov:
  token: # Not needed if using GitHub Actions with secret
  bot: false
  ci:
    - GitHub Actions

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        base: auto
    patch:
      default:
        target: 70%
        threshold: 1%

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

flags:
  unittests:
    paths:
      - src/
    carryforward: true

ignore:
  - "tests/"
  - "*/tests/*"
  - "*/test_*.py"
  - "*/__pycache__/*"
  - "*/venv/*"
  - "*/env/*"
  - "dist/"
  - "build/"
  - "*.pyc"

