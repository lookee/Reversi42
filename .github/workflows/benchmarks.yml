name: Performance Benchmarks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-benchmark memory-profiler
    
    - name: Run bitboard benchmarks
      run: |
        python -c "
        import sys
        import os
        sys.path.insert(0, os.path.join(os.getcwd(), 'src'))
        
        import time
        from Reversi.BitboardGame import BitboardGame
        
        # Benchmark move generation
        game = BitboardGame()
        iterations = 10000
        
        start = time.perf_counter()
        for _ in range(iterations):
            moves = game.get_valid_moves(1)
        elapsed = (time.perf_counter() - start) / iterations * 1e9
        
        print(f'Move generation: {elapsed:.1f} ns/op')
        
        # Benchmark make_move
        start = time.perf_counter()
        for _ in range(iterations):
            new_game = game.make_move(19)
        elapsed = (time.perf_counter() - start) / iterations * 1e9
        
        print(f'Make move: {elapsed:.1f} ns/op')
        "
    
    - name: Run AI performance benchmarks
      run: |
        python -c "
        import sys
        import os
        sys.path.insert(0, os.path.join(os.getcwd(), 'src'))
        
        import time
        from Reversi.BitboardGame import BitboardGame
        from Players.PlayerApocalyptron import PlayerApocalyptron
        
        game = BitboardGame()
        player = PlayerApocalyptron(depth=6, book_instant=True)
        
        # Benchmark AI move at depth 6
        moves = game.get_valid_moves(1)
        
        start = time.perf_counter()
        move = player.get_move(game, moves, None)
        elapsed = time.perf_counter() - start
        
        print(f'AI move (depth 6): {elapsed:.3f} seconds')
        
        # Should be under 1.0 seconds (CI-friendly threshold)
        if elapsed > 1.0:
            print('⚠️  Warning: AI slower than expected')
        else:
            print('✅ AI performance within limits')
        "
      timeout-minutes: 10
      env:
        REVERSI42_VIEW: headless
    
    - name: Memory usage test
      run: |
        python -c "
        import sys
        import os
        sys.path.insert(0, os.path.join(os.getcwd(), 'src'))
        
        from Reversi.BitboardGame import BitboardGame
        
        # Check game state size
        game = BitboardGame()
        size = sys.getsizeof(game)
        print(f'BitboardGame size: {size} bytes')
        
        # Should be under 1KB
        if size > 1024:
            print('⚠️  Warning: Game state larger than expected')
        else:
            print('✅ Memory usage optimal')
        "
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v5
      with:
        name: benchmark-results
        path: |
          benchmark_*.txt
        retention-days: 90
      if: always()
    
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        script: |
          const output = 'Benchmark results will be added here';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 📊 Performance Benchmark Results\n\n${output}`
          });
      continue-on-error: true

