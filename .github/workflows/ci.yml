name: CI

on:
  push:
    branches: [ master, develop, doc ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Check code formatting with Black
      run: |
        black --check src/ tests/
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src/ tests/
    
    - name: Lint with pylint
      run: |
        pylint src/ --fail-under=7.0 --output-format=colorized
    
    - name: Type checking with mypy
      run: |
        mypy src/ --ignore-missing-imports
      continue-on-error: true
    
    - name: Security check with Bandit
      run: |
        bandit -r src/ -ll --skip B110,B311,B112 || true
      continue-on-error: true

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Install Playwright browsers
      shell: bash
      run: |
        # Install Chromium browser with system dependencies on Linux
        if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
          python -m playwright install --with-deps chromium
        else
          python -m playwright install chromium
        fi
        # Verify installation
        python -m playwright --version
        # List installed browsers
        python -m playwright install --dry-run chromium || echo "Browser installation check completed"
    
    - name: Run unit tests (Python 3.9 - sequential)
      if: matrix.python-version == '3.9'
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      timeout-minutes: 45
      env:
        REVERSI42_VIEW: headless
    
    - name: Run unit tests (Python 3.10+ - Linux parallel, Windows/Mac sequential)
      if: matrix.python-version != '3.9' && matrix.os == 'ubuntu-latest'
      run: |
        # Clean any existing coverage files
        rm -f .coverage coverage.xml
        rm -rf htmlcov/.coverage.* 2>/dev/null || true
        # Run tests with coverage
        # Limit parallel workers to 4 to avoid resource exhaustion on CI
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term --cov-report=html -n 4
        # Verify coverage.xml was created
        if [ ! -f coverage.xml ]; then
          echo "[WARNING] coverage.xml not found after pytest, checking for .coverage files..."
          find . -name ".coverage*" -o -name "coverage.xml" 2>/dev/null || true
          # Try to generate coverage.xml manually if .coverage exists
          if [ -f .coverage ]; then
            echo "Found .coverage file, attempting to generate coverage.xml..."
            coverage xml || python -m coverage xml
          fi
        fi
      timeout-minutes: 45
      env:
        REVERSI42_VIEW: headless
      continue-on-error: false
    
    - name: Run unit tests (Python 3.10+ - Windows/Mac sequential)
      if: matrix.python-version != '3.9' && matrix.os != 'ubuntu-latest'
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      timeout-minutes: 45
      env:
        REVERSI42_VIEW: headless
    
    - name: Verify coverage.xml exists and is valid (Ubuntu)
      if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      continue-on-error: true
      shell: bash
      run: |
        set -e
        if [ ! -f coverage.xml ]; then
          echo "[ERROR] coverage.xml not found!"
          echo "Listing current directory:"
          ls -la || true
          echo "Looking for coverage files:"
          find . -name "coverage.xml" -o -name "*.coverage" 2>/dev/null || true
          exit 1
        fi
        echo "[OK] coverage.xml found"
        ls -lh coverage.xml
        # Verify the file contains coverage data
        if ! grep -q "<coverage" coverage.xml; then
          echo "[ERROR] coverage.xml appears to be invalid or empty!"
          echo "File size: $(wc -c < coverage.xml) bytes"
          head -n 50 coverage.xml || cat coverage.xml
          exit 1
        fi
        echo "[OK] coverage.xml appears to be valid"
        # Show summary (with error handling)
        python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(f'Coverage file contains {len(root.findall(\".//class\"))} classes'); sources = root.findall('.//source'); print(f'Sources found: {len(sources)}'); [print(f'  - {s.text}') for s in sources[:5]]" || echo "[WARNING] Could not parse coverage.xml summary"
        # Show first few lines to verify paths
        echo "First 20 lines of coverage.xml:"
        head -n 20 coverage.xml || echo "⚠️ Could not read coverage.xml"
    
    - name: Verify coverage.xml exists and is valid (Mac/Windows)
      if: always() && matrix.os != 'ubuntu-latest' && matrix.python-version == '3.11'
      continue-on-error: true
      run: |
        python -c "
        import os
        import sys
        import io
        
        # Set UTF-8 encoding for stdout on Windows
        if sys.platform == 'win32':
            sys.stdout = io.TextIOWrapper(sys.stdout.buffer, encoding='utf-8', errors='replace')
        
        if not os.path.exists('coverage.xml'):
            print('[ERROR] coverage.xml not found!')
            print('Listing current directory:')
            try:
                for item in os.listdir('.'):
                    print(f'  {item}')
            except Exception as e:
                print(f'Error listing directory: {e}')
            
            # Look for coverage files
            import glob
            coverage_files = glob.glob('**/*coverage*', recursive=True)
            if coverage_files:
                print('Found coverage-related files:')
                for f in coverage_files[:10]:
                    print(f'  {f}')
            else:
                print('No coverage files found')
            sys.exit(1)
        
        print('[OK] coverage.xml found')
        file_size = os.path.getsize('coverage.xml')
        print(f'File size: {file_size} bytes')
        
        # Verify the file contains coverage data
        try:
            with open('coverage.xml', 'r', encoding='utf-8') as f:
                content = f.read(1000)
                if '<coverage' not in content:
                    print('[ERROR] coverage.xml appears to be invalid or empty!')
                    print('First 500 characters:')
                    print(content[:500])
                    sys.exit(1)
        except Exception as e:
            print(f'[ERROR] Error reading coverage.xml: {e}')
            sys.exit(1)
        
        print('[OK] coverage.xml appears to be valid')
        
        # Show summary
        try:
            import xml.etree.ElementTree as ET
            tree = ET.parse('coverage.xml')
            root = tree.getroot()
            classes = root.findall('.//class')
            sources = root.findall('.//source')
            print(f'Coverage file contains {len(classes)} classes')
            print(f'Sources found: {len(sources)}')
            for s in sources[:5]:
                print(f'  - {s.text}')
        except Exception as e:
            print(f'[WARNING] Could not parse coverage.xml summary: {e}')
        
        # Show first few lines
        try:
            with open('coverage.xml', 'r', encoding='utf-8') as f:
                lines = [f.readline() for _ in range(20)]
                print('First 20 lines of coverage.xml:')
                for line in lines:
                    if line:
                        print(line.rstrip())
        except Exception as e:
            print(f'[WARNING] Could not read coverage.xml: {e}')
        "
    
    - name: Fix coverage paths for Codecov
      if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      continue-on-error: true
      shell: bash
      run: |
        if [ -f coverage.xml ]; then
          echo "Fixing paths in coverage.xml..."
          # Replace absolute paths with relative paths
          sed -i 's|/home/runner/work/[^/]*/[^/]*/||g' coverage.xml || true
          sed -i 's|/Users/[^/]*/[^/]*/[^/]*/||g' coverage.xml || true
          # Ensure source paths are relative
          sed -i 's|<source>.*src</source>|<source>src</source>|g' coverage.xml || true
          echo "[OK] Paths fixed in coverage.xml"
        fi
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      continue-on-error: true
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest
    
    - name: Run integration tests
      run: |
        pytest tests/apocalyptron/integration/ -v
      timeout-minutes: 30
      env:
        REVERSI42_VIEW: headless
    
    - name: Test full game AI vs AI
      run: |
        reversi42 --help || echo "CLI test completed"
      timeout-minutes: 5

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-package
        path: dist/
        retention-days: 7

  status-check:
    name: CI Status
    if: always()
    needs: [code-quality, test, integration-tests, build-check]
    runs-on: ubuntu-latest
    
    steps:
    - name: Check CI status
      run: |
        if [ "${{ needs.code-quality.result }}" != "success" ] || \
           [ "${{ needs.test.result }}" != "success" ] || \
           [ "${{ needs.integration-tests.result }}" != "success" ] || \
           [ "${{ needs.build-check.result }}" != "success" ]; then
          echo "[ERROR] CI checks failed"
          exit 1
        else
          echo "[OK] All CI checks passed"
        fi

