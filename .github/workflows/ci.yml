name: CI

on:
  push:
    branches: [ master, develop, doc ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Check code formatting with Black
      run: |
        black --check src/ tests/
    
    - name: Check import sorting with isort
      run: |
        isort --check-only src/ tests/
    
    - name: Lint with pylint
      run: |
        pylint src/ --fail-under=7.0 --output-format=colorized
    
    - name: Type checking with mypy
      run: |
        mypy src/ --ignore-missing-imports
      continue-on-error: true
    
    - name: Security check with Bandit
      run: |
        bandit -r src/ -ll --skip B110,B311,B112
      continue-on-error: true

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Run unit tests (Python 3.9 - sequential)
      if: matrix.python-version == '3.9'
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      timeout-minutes: 45
      env:
        REVERSI42_VIEW: headless
    
    - name: Run unit tests (Python 3.10+ - Linux parallel, Windows/Mac sequential)
      if: matrix.python-version != '3.9' && matrix.os == 'ubuntu-latest'
      run: |
        # Clean any existing coverage files
        rm -f .coverage coverage.xml
        rm -rf htmlcov/.coverage.* 2>/dev/null || true
        # Run tests with coverage
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term --cov-report=html -n auto
        # Verify coverage.xml was created
        if [ ! -f coverage.xml ]; then
          echo "⚠️ coverage.xml not found after pytest, checking for .coverage files..."
          find . -name ".coverage*" -o -name "coverage.xml" 2>/dev/null || true
          # Try to generate coverage.xml manually if .coverage exists
          if [ -f .coverage ]; then
            echo "Found .coverage file, attempting to generate coverage.xml..."
            coverage xml || python -m coverage xml
          fi
        fi
      timeout-minutes: 30
      env:
        REVERSI42_VIEW: headless
      continue-on-error: false
    
    - name: Run unit tests (Python 3.10+ - Windows/Mac sequential)
      if: matrix.python-version != '3.9' && matrix.os != 'ubuntu-latest'
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
      timeout-minutes: 45
      env:
        REVERSI42_VIEW: headless
    
    - name: Verify coverage.xml exists and is valid
      if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      continue-on-error: true
      run: |
        set -e
        if [ ! -f coverage.xml ]; then
          echo "❌ coverage.xml not found!"
          echo "Listing current directory:"
          ls -la || true
          echo "Looking for coverage files:"
          find . -name "coverage.xml" -o -name "*.coverage" 2>/dev/null || true
          exit 1
        fi
        echo "✅ coverage.xml found"
        ls -lh coverage.xml
        # Verify the file contains coverage data
        if ! grep -q "<coverage" coverage.xml; then
          echo "❌ coverage.xml appears to be invalid or empty!"
          echo "File size: $(wc -c < coverage.xml) bytes"
          head -n 50 coverage.xml || cat coverage.xml
          exit 1
        fi
        echo "✅ coverage.xml appears to be valid"
        # Show summary (with error handling)
        python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(f'Coverage file contains {len(root.findall(\".//class\"))} classes'); sources = root.findall('.//source'); print(f'Sources found: {len(sources)}'); [print(f'  - {s.text}') for s in sources[:5]]" || echo "⚠️ Could not parse coverage.xml summary"
        # Show first few lines to verify paths
        echo "First 20 lines of coverage.xml:"
        head -n 20 coverage.xml || echo "⚠️ Could not read coverage.xml"
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      continue-on-error: true
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
        upload: true
        slug: ${{ github.repository }}
        branch: ${{ github.head_ref || github.ref_name }}
        commit: ${{ github.event.pull_request.head.sha || github.sha }}
        files:
          - ./coverage.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest
    
    - name: Run integration tests
      run: |
        pytest tests/apocalyptron/integration/ -v
      timeout-minutes: 30
      env:
        REVERSI42_VIEW: headless
    
    - name: Test full game AI vs AI
      run: |
        reversi42 --help || echo "CLI test completed"
      timeout-minutes: 5

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: python-package
        path: dist/
        retention-days: 7

  status-check:
    name: CI Status
    if: always()
    needs: [code-quality, test, integration-tests, build-check]
    runs-on: ubuntu-latest
    
    steps:
    - name: Check CI status
      run: |
        if [ "${{ needs.code-quality.result }}" != "success" ] || \
           [ "${{ needs.test.result }}" != "success" ] || \
           [ "${{ needs.integration-tests.result }}" != "success" ] || \
           [ "${{ needs.build-check.result }}" != "success" ]; then
          echo "❌ CI checks failed"
          exit 1
        else
          echo "✅ All CI checks passed"
        fi

