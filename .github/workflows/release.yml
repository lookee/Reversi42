name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'  # Match: 5.0.0, 4.1.16, etc.
      - 'v[0-9]+.[0-9]+.[0-9]+' # Match: v5.0.0 (supporto opzionale)
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 5.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-python-package:
    name: Build Python Package (sdist + wheels)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel
    
    - name: Build sdist and wheel
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
        
    - name: List built artifacts
      run: |
        echo "📦 Built packages:"
        ls -lh dist/
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: python-package
        path: dist/
        retention-days: 30

  build-executables:
    name: Build Executables (Cross-Platform)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: x86_64
          - os: windows-latest
            platform: windows
            arch: x86_64
    runs-on: ${{ matrix.os }}
    needs: build-python-package
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller setuptools wheel
        pip install -e .
    
    - name: Extract version (Windows)
      if: matrix.os == 'windows-latest'
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $VERSION = "${{ github.event.inputs.version }}"
        } else {
          $VERSION = "${{ github.ref }}".Replace("refs/tags/", "").Replace("v", "")
        }
        Write-Host "version=$VERSION" >> $env:GITHUB_OUTPUT
        Write-Host "Version: $VERSION"
    
    - name: Extract version (macOS/Linux)
      if: matrix.os != 'windows-latest'
      id: version
      shell: bash
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Build executable
      run: |
        pyinstaller reversi42.spec --clean --noconfirm
      continue-on-error: false
    
    - name: Determine executable name (Windows)
      if: matrix.os == 'windows-latest'
      id: exe_name
      shell: pwsh
      run: |
        $VERSION = "${{ steps.version.outputs.version }}"
        $PLATFORM = "${{ matrix.platform }}"
        $ARCH = "${{ matrix.arch }}"
        $EXE_NAME = "reversi42-${PLATFORM}-${ARCH}-${VERSION}.exe"
        $EXE_PATH = "dist\reversi42.exe"
        Write-Host "exe_name=$EXE_NAME" >> $env:GITHUB_OUTPUT
        Write-Host "exe_path=$EXE_PATH" >> $env:GITHUB_OUTPUT
        Write-Host "Executable: $EXE_NAME"
    
    - name: Determine executable name (macOS/Linux)
      if: matrix.os != 'windows-latest'
      id: exe_name
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        PLATFORM="${{ matrix.platform }}"
        ARCH="${{ matrix.arch }}"
        EXE_NAME="reversi42-${PLATFORM}-${ARCH}-${VERSION}"
        EXE_PATH="dist/reversi42"
        echo "exe_name=$EXE_NAME" >> $GITHUB_OUTPUT
        echo "exe_path=$EXE_PATH" >> $GITHUB_OUTPUT
        echo "Executable: $EXE_NAME"
    
    - name: Rename executable (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        if (Test-Path "${{ steps.exe_name.outputs.exe_path }}") {
          Move-Item -Path "${{ steps.exe_name.outputs.exe_path }}" -Destination "dist\${{ steps.exe_name.outputs.exe_name }}" -Force
        }
    
    - name: Rename executable (macOS/Linux)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        if [ -f "${{ steps.exe_name.outputs.exe_path }}" ]; then
          mv "${{ steps.exe_name.outputs.exe_path }}" "dist/${{ steps.exe_name.outputs.exe_name }}"
        fi
    
    - name: Create archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        Set-Location dist
        $exeName = "${{ steps.exe_name.outputs.exe_name }}"
        if (Test-Path $exeName) {
          Compress-Archive -Path $exeName -DestinationPath "${exeName}.zip" -Force
          Write-Host "Archive created: ${exeName}.zip"
        } else {
          Write-Host "Error: Executable not found: $exeName"
          Get-ChildItem | Format-Table
          exit 1
        }
        Set-Location ..
        Get-ChildItem dist/ | Format-Table
    
    - name: Create archive (macOS/Linux)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        cd dist
        if [ "${{ matrix.os }}" == "macos-latest" ]; then
          zip -q "${{ steps.exe_name.outputs.exe_name }}.zip" "${{ steps.exe_name.outputs.exe_name }}"
        else
          tar -czf "${{ steps.exe_name.outputs.exe_name }}.tar.gz" "${{ steps.exe_name.outputs.exe_name }}"
        fi
        cd ..
        ls -lh dist/
    
    - name: Upload executable artifact
      uses: actions/upload-artifact@v5
      with:
        name: executable-${{ matrix.platform }}-${{ matrix.arch }}
        path: |
          dist/${{ steps.exe_name.outputs.exe_name }}
          dist/${{ steps.exe_name.outputs.exe_name }}.*
        retention-days: 30

  build-docker-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-python-package
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          # Estrai versione dal tag (con o senza 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}  # Rimuovi 'v' se presente
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"
    
    - name: Prepare Docker metadata
      id: meta
      run: |
        # Convert repository name to lowercase (Docker requirement)
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "repository=$REPO_LOWER" >> $GITHUB_OUTPUT
        echo "Repository (lowercase): $REPO_LOWER"
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ steps.meta.outputs.repository }}:latest
          ghcr.io/${{ steps.meta.outputs.repository }}:${{ steps.version.outputs.version }}
        labels: |
          org.opencontainers.image.title=Reversi42
          org.opencontainers.image.description=AI-Powered Reversi/Othello Web Game
          org.opencontainers.image.url=https://github.com/${{ github.repository }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ steps.version.outputs.version }}
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    needs: [build-python-package, build-executables, build-docker-image]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
    
    - name: Download Python package artifacts
      uses: actions/download-artifact@v6
      with:
        name: python-package
        path: dist/
    
    - name: Download executable artifacts
      uses: actions/download-artifact@v6
      with:
        name: executable-linux-x86_64
        path: dist/executables/linux/
        if-no-files-found: ignore
    - name: Download macOS executable
      uses: actions/download-artifact@v6
      with:
        name: executable-macos-x86_64
        path: dist/executables/macos/
        if-no-files-found: ignore
    - name: Download Windows executable
      uses: actions/download-artifact@v6
      with:
        name: executable-windows-x86_64
        path: dist/executables/windows/
        if-no-files-found: ignore
    
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          # Estrai versione dal tag (con o senza 'v' prefix)
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}  # Rimuovi 'v' se presente
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Generate release notes
      id: release_notes
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        
        # Extract changelog section
        if [ -f CHANGELOG.md ]; then
          sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | head -n -1 > release_notes.md
        else
          echo "Release $VERSION" > release_notes.md
        fi
        
        # Add installation instructions
        cat >> release_notes.md << 'EOF'
        
        ## 📦 Installation
        
        ### Option 1: Python Package (Recommended)
        ```bash
        pip install reversi42
        reversi42
        ```
        
        ### Option 2: Docker
        ```bash
        docker run -p 8000:8000 ghcr.io/lookee/reversi42:${{ steps.version.outputs.version }}
        ```
        Then open: http://localhost:8000
        
        ### Option 3: Standalone Executables
        Download the executable for your platform from the assets below:
        - **Windows**: `reversi42-windows-x86_64-${{ steps.version.outputs.version }}.exe.zip`
        - **macOS**: `reversi42-macos-x86_64-${{ steps.version.outputs.version }}.zip`
        - **Linux**: `reversi42-linux-x86_64-${{ steps.version.outputs.version }}.tar.gz`
        
        Extract and run directly - no Python installation required!
        
        ### Option 4: From Source
        ```bash
        pip install dist/reversi42-${{ steps.version.outputs.version }}-py3-none-any.whl
        reversi42
        ```
        
        ## 🎮 Quick Start
        ```bash
        reversi42                      # Start with defaults
        reversi42 --port 3000         # Custom port
        reversi42 --list-players      # List AI opponents
        reversi42 --help              # Show all options
        ```
        EOF
    
    - name: Prepare release files
      run: |
        # Collect all files for release
        mkdir -p release_files
        cp dist/*.whl release_files/ 2>/dev/null || true
        cp dist/*.tar.gz release_files/ 2>/dev/null || true
        find dist/executables -type f -exec cp {} release_files/ \; 2>/dev/null || true
        ls -lh release_files/
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release_files/*
        body_path: release_notes.md
        draft: false
        prerelease: false
        generate_release_notes: true
        name: Release ${{ steps.version.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: create-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/project/reversi42/
    
    steps:
    - name: Download package
      uses: actions/download-artifact@v6
      with:
        name: python-package
        path: dist/
    
    - name: List files to publish
      run: |
        echo "📦 Publishing to PyPI:"
        ls -lh dist/
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip_existing: true
        verbose: true

  publish-test-pypi:
    name: Publish to Test PyPI
    needs: build-python-package
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Download package
      uses: actions/download-artifact@v6
      with:
        name: python-package
        path: dist/
    
    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.TEST_PYPI_API_TOKEN }}
        repository-url: https://test.pypi.org/legacy/
        skip_existing: true
        verbose: true
