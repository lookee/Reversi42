name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

version-resolver:
  major:
    labels:
      - 'breaking'
      - 'major'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'fix'
      - 'bug'
      - 'patch'
  default: patch

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  
  - title: '⚡ Performance Improvements'
    labels:
      - 'performance'
      - 'perf'
  
  - title: '📚 Documentation'
    labels:
      - 'documentation'
      - 'docs'
  
  - title: '🔒 Security'
    labels:
      - 'security'
      - 'vulnerability'
  
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'refactor'
  
  - title: '🧪 Testing'
    labels:
      - 'test'
      - 'testing'

exclude-labels:
  - 'skip-changelog'
  - 'wip'
  - 'invalid'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

template: |
  ## What's Changed
  
  $CHANGES
  
  ## 📊 Statistics
  
  - **Contributors**: $CONTRIBUTORS
  - **Pull Requests**: $NUMBER_OF_PULL_REQUESTS
  - **Commits**: $NUMBER_OF_COMMITS_IN_RELEASE
  
  ## 🙏 Contributors
  
  $CONTRIBUTORS
  
  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

autolabeler:
  - label: 'documentation'
    files:
      - 'docs/**/*'
      - '*.md'
  
  - label: 'feature'
    branch:
      - '/^feature\/.+/'
  
  - label: 'fix'
    branch:
      - '/^fix\/.+/'
  
  - label: 'test'
    files:
      - 'tests/**/*'
  
  - label: 'dependencies'
    files:
      - 'requirements*.txt'
      - 'pyproject.toml'
  
  - label: 'ci'
    files:
      - '.github/**/*'

replacers:
  - search: '/\b(closes|fixes|resolves)\s#(\d+)/gi'
    replace: 'Closes #$2'

