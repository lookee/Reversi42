# ============================================================================
# NEURAL PRIME 🔢 - Deep Reinforcement Learning Player
# ============================================================================
# Neural network player trained via Reinforcement Learning (AlphaZero-style).
# Uses a deep neural network that learns by playing against itself.
# 
# Strategy: Neural network + MCTS (AlphaZero-style)
# Training: Self-play reinforcement learning with MCTS
# Target: ELO varies based on training progress
# Speed: Configurable (MCTS simulations, policy-only mode)
# Best for: Challenging opponent, testing against learned strategies
# ============================================================================

metadata:
  name: "NEURAL_PRIME"
  display_name: "Neural Prime"
  description: "Deep Reinforcement Learning player - Neural network trained via self-play reinforcement learning"
  headline: "NEURAL NETWORK + REINFORCEMENT LEARNING"
  enabled: true
  icon: "🔢"  # Mathematical/prime number theme
  type: "rl"  # Special type for RL player
  
  # Avatar: Neural network / AI brain theme
  # Suggested: Brain with neural connections, glowing nodes, futuristic
  # Path is relative to neural directory
  avatar: "avatars/neural_prime.png"
  
  category: "advanced"  # Advanced AI player
  estimated_elo: 0  # Varies based on training progress
  
  stats:
    power: 0       # Depends on training
    speed: 10       # MCTS is slower than minimax
    accuracy: 0    # Neural network evaluation
    depth: 0       # Not depth-based (MCTS-based)
    lethality: 0   # Learning-based strategy

# RL-specific configuration
rl:
  # Path to model checkpoint (relative to project root)
  # Models are stored in config/players/enabled/neural/neuralnetwork/ after export
  # Default: ONNX format (lightweight, no PyTorch needed)
  # Options:
  #   - "config/players/enabled/neural/neuralnetwork/neural_prime.onnx" (ONNX - lightweight, recommended)
  #   - "config/neuralnetwork/latest.pth" (PyTorch - requires torch, enables MCTS)
  #   - "experimental/checkpoints/latest.pth" (Training checkpoint - PyTorch only)
  model_path: "config/players/enabled/neural/neuralnetwork/neural_prime.onnx"
  
  # Use MCTS for move selection (stronger but slower)
  # If false, uses direct policy (faster but weaker)
  # NOTE: MCTS requires PyTorch (.pth model), not available with ONNX
  # Set to false when using ONNX model
  use_mcts: false
  
  # Number of MCTS simulations (only if use_mcts=true)
  # More simulations = stronger but slower
  # Recommended: 400-800 for balanced play
  mcts_simulations: 400
  
  # Sampling temperature for move selection
  # 0.0 = deterministic (always best move)
  # Higher = more random/variety
  # Recommended: 0.1 for competitive play
  temperature: 0.1

# Dummy sections for validation (not used for RL player)
engine:
  depth:
    base: 1  # Minimum valid value (not used)
    strategy: "fixed"
evaluation:
  preset: "balanced"
move_ordering:
  strategies: []
pruning:
  null_move:
    enabled: false
opening_book:
  enabled: false
behavior:
  time:
    think_time_ms: 0
  randomization:
    enabled: false

# ============================================================================
# NEURAL PRIME CONFIGURATION NOTES
# ============================================================================
# 
# WHAT IS NEURAL PRIME?
# Neural Prime is a deep reinforcement learning player that uses a neural network
# trained via self-play. The network learns optimal strategies by playing millions
# of games against itself, improving over time through reinforcement learning.
# 
# TRAINING METHOD:
# - Self-play: The network plays against itself
# - MCTS: Uses Monte Carlo Tree Search during training
# - Reinforcement Learning: Learns from game outcomes
# - AlphaZero-style: Inspired by AlphaZero/AlphaGo Zero
# 
# MODEL PATH:
# - Default: config/players/enabled/neural/neuralnetwork/neural_prime.onnx
# - Models are stored in config/players/enabled/neural/neuralnetwork/ after export
# - Change to use a specific checkpoint (e.g., best.pth from experimental/checkpoints/)
# - Model must exist or player will fail to load
# - Path is relative to project root
# 
# MCTS MODE:
# - use_mcts: true (recommended)
#   - Uses MCTS with neural network for evaluation
#   - Stronger play but slower (~7-14s per move)
#   - Recommended for competitive play
# 
# - use_mcts: false
#   - Uses direct policy from neural network
#   - Faster play (<1s per move) but weaker
#   - Good for quick games or testing
# 
# MCTS SIMULATIONS:
# - 100-200: Fast but weak
# - 400: Balanced (recommended) ⭐
# - 800: Strong but slow
# - 1600+: Very strong but very slow
# 
# TEMPERATURE:
# - 0.0: Deterministic (always best move)
# - 0.1: Slight variety (recommended) ⭐
# - 0.2-0.3: More variety
# - 0.5+: High variety (less optimal)
# 
# PERFORMANCE:
# - MCTS 400 sim: ~7s per move, strong play
# - MCTS 800 sim: ~14s per move, very strong play
# - Policy only: <1s per move, moderate play
# 
# TRAINING:
# - Model improves with training iterations
# - Training checkpoints are in experimental/checkpoints/
# - Exported models for inference are in config/players/enabled/neural/neuralnetwork/
# - latest.pth = most recent training checkpoint
# - neural_prime.onnx = exported ONNX model for lightweight inference
# - best.pth = best performing checkpoint (if available)
# 
# ============================================================================
# GETTING STARTED:
# 
# 1. Ensure model exists: config/players/enabled/neural/neuralnetwork/neural_prime.onnx
#    (or export from experimental/checkpoints/latest.pth if needed)
# 2. Use default settings (MCTS 400 sim, temp 0.1)
# 3. Adjust mcts_simulations for speed/strength tradeoff
# 4. Set use_mcts: false for faster games (required for ONNX models)
# 
# ============================================================================

