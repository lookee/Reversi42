# ============================================================================
# THE ORACLE 🔮 - Seer of Fates
# ============================================================================
# Endgame specialist configuration - Prophetic vision
# 
# Strategy: Adaptive depth with extreme endgame prophesy
# Target: Advanced level (ELO ~1850)
# Speed: Moderate (contemplative wisdom)
# Best for: Endgame mastery, prophetic calculation, tournament endgames
# ============================================================================

metadata:
  name: "THE ORACLE"
  display_name: "The Oracle"
  description: "Endgame Prophet - Seer of Fates"
  headline: "PROPHETIC VISION ACTIVATED"
  enabled: true
  icon: "🔮"
  
  # Avatar: Mystical prophet with cosmic vision
  # Suggested: Crystal ball with swirling galaxies, purple/blue mystical aura
  # Path is relative to project root
  # Example image: Glowing crystal orb with stars/nebula inside, mystical symbols
  avatar: "avatars/the_oracle.png"  # Create 512x512 PNG with mystical theme
  
  category: "advanced"
  estimated_elo: 1850
  
  stats:
    power: 9       # Prophetic dominance
    speed: 4       # Contemplative wisdom
    accuracy: 9    # Prescient precision
    depth: 10      # Sees all futures
    lethality: 8   # Inevitable fate

engine:
  depth:
    base: 9
    strategy: "adaptive"
    
    # Adaptive depth: Conservative opening → Standard midgame → Prophetic endgame
    # The Oracle's power grows as the game progresses
    adaptive:
      opening: 7   # Opening (moves 1-20): Depth 7 (trust the book + light calc)
      midgame: 9   # Midgame (moves 21-50): Depth 9 (standard calculation)
      endgame: 14  # Endgame (moves 51-60): Depth 14 (see the future!)
    
    # Note: At depth 14 endgame, The Oracle can see 14 half-moves ahead
    # With ~10 empty squares, this is near-perfect play
  
  # Moderate parallelization (4 cores balanced for depth 7-14)
  parallel:
    enabled: true
    num_workers: 4  # Balanced for laptop/desktop CPUs
  
  # Standard transposition table
  transposition_table:
    enabled: true
    size_mb: 128    # Standard cache size
  
  # Aspiration windows (very effective with adaptive + iterative)
  aspiration_windows:
    enabled: true
    initial_width: 40   # Slightly narrow (aggressive)
    widen_factor: 2.0

evaluation:
  # Endgame specialist preset
  # Emphasizes parity and piece count (critical in endgame)
  preset: "endgame_specialist"
  
  # The endgame_specialist preset configures:
  # - Parity: weight 2.0 (who moves last = huge advantage)
  # - Stability: weight 1.5 (stable discs = guaranteed points)
  # - Positional: weight 1.0 (corners/edges still important)
  # - Mobility: weight 0.8 (less critical in endgame)
  # 
  # Fine-tuned weights:
  # - parity_favorable: 50 (2x boost - endgame parity is critical)
  # - piece_count_weight: 35 (1.75x boost - disc count matters more)
  # - stability_weight: 18 (boosted - stable = permanent)

move_ordering:
  strategies:
    # All ordering strategies enabled
    # Especially important with deep endgame search
    - name: "pv_move"
      enabled: true
      priority: 100
    
    - name: "killer_moves"
      enabled: true
      priority: 90
      max_killers_per_ply: 2
    
    - name: "history_heuristic"
      enabled: true
      priority: 80
      decay_factor: 0.95
    
    - name: "positional"
      enabled: true
      priority: 70

pruning:
  # All pruning optimizations enabled
  # Essential for reaching depth 14 in reasonable time
  
  null_move:
    enabled: true
    reduction_depth: 3
    min_depth: 3
  
  futility:
    enabled: true
    margin: 120     # Higher margin (more conservative in endgame)
    max_depth: 3
  
  late_move_reduction:
    enabled: true
    threshold_move: 4
    reduction_depth: 1
    min_depth: 3
  
  multi_cut:
    enabled: true
    threshold_cuts: 3
    verification_depth: 2

opening_book:
  # Use opening book with evaluated strategy
  # The Oracle validates theory with engine wisdom
  enabled: true
  strategy: "evaluated"
  
  evaluation:
    advantage_weight: 0.3   # Higher weight on advantage (quality over variety)
    variety_weight: 0.05    # Lower variety (more focused on best lines)
    only_evaluated: true
  
  display:
    show_options: false
    show_analysis: false
    verbose: false

behavior:
  time:
    think_time_ms: 0      # No artificial delay
    max_time_ms: null     # No time limit (prophets don't rush)
  
  logging:
    level: "normal"       # Standard output
    show_statistics: true # Show search stats (impressive at depth 14!)
    show_thinking: false
    show_evaluation: false
  
  randomization:
    enabled: false        # Deterministic prophecy
    temperature: 0.0

advanced:
  # All advanced features disabled (proven configuration)
  quiescence:
    enabled: false
  
  singular_extension:
    enabled: false
  
  razoring:
    enabled: false
  
  iid:
    enabled: false
  
  debug:
    validate_moves: false
    track_nodes: false
    export_search_tree: false

# ============================================================================
# THE ORACLE PERFORMANCE NOTES
# ============================================================================
# 
# Expected Performance by Game Phase:
# 
# OPENING (moves 1-20, depth 7):
# - In book: 0-10 ms (instant)
# - Out of book: 500-1500 ms (0.5-1.5 seconds)
# - Strategy: Trust professional theory, light engine validation
# 
# MIDGAME (moves 21-50, depth 9):
# - Time: 2-8 seconds per move
# - Nodes: 200K-1M
# - Strategy: Standard tactical calculation
# 
# ENDGAME (moves 51-60, depth 14):
# - Time: 3-15 seconds per move (faster than midgame despite deeper!)
# - Nodes: 500K-2M (fewer legal moves = faster despite depth)
# - Strategy: Prophetic calculation (can see entire endgame)
# 
# Why faster in endgame despite depth 14?
# - Fewer empty squares = fewer legal moves per position
# - Branching factor drops from ~8-10 to ~3-5
# - Better pruning (fewer tactical complexities)
# - Transposition table more effective (more repeated positions)
# 
# Hardware Requirements:
# - CPU: 4+ cores recommended
# - RAM: 256 MB (128 MB TT + 128 MB workers)
# - OS: Any
# 
# Strength Profile:
# - Opening: Very strong (professional book + validation)
# - Midgame: Strong (depth 9 is competitive)
# - Endgame: Elite (depth 14 is near-perfect)
# - Overall: Advanced tier (ELO ~1850)
# 
# Endgame Strength Examples:
# - 10 empty squares: Depth 14 sees to exact game end (perfect!)
# - 12 empty squares: Depth 14 covers most variations (excellent)
# - 15 empty squares: Depth 14 still very strong (prophetic)
# - 20 empty squares: Depth 14 tactical horizon (very good)
# 
# Comparison to Other Players:
# - vs DIVZERO (depth 16 endgame): Slightly weaker but faster
# - vs Lightning (depth 4): Crushes in endgame (+200 ELO there)
# - vs Balanced (depth 8 fixed): Better endgame, weaker opening
# 
# When The Oracle Shines:
# - Tight endgames (parity emphasis wins close games)
# - Complex endgames requiring exact calculation
# - Tournament play (strong endgame is differentiator)
# - Learning endgame technique (shows perfect play)
# 
# When The Oracle Struggles:
# - Opening novelties (relies on book + moderate depth)
# - Blitz games (takes time to calculate)
# - Very deep midgame tactics (only depth 9)
# 
# Tuning Options:
# - For stronger endgame: Increase endgame to 15-16 (slower)
# - For faster play: Reduce endgame to 12 (still very strong)
# - For better midgame: Increase midgame to 10
# - For more cores: Set num_workers to 6-8
# - For less RAM: Reduce size_mb to 64
# 
# Advanced Endgame Notes:
# 
# Parity Importance:
# - Moving last in endgame = filling last empty squares
# - Can swing 6-12 points in close games
# - The Oracle's 2x parity weight captures this
# 
# Depth 14 Coverage:
# - At 10 empties: Complete game tree (perfect play)
# - At 12 empties: ~95% coverage (excellent)
# - At 14 empties: ~80% coverage (very good)
# - At 16 empties: ~60% coverage (good)
# 
# Prophetic Accuracy:
# - Endgame predictions within ±2 points typically
# - Perfect play when empties ≤ depth/2
# - Occasionally finds brilliant sacrifices humans miss
# 
# Philosophy:
# "The future is not fixed, but I have seen its branches.
#  Every move narrows the possibilities. Every choice reveals destiny.
#  In the endgame, there is only truth - and I see it all."
#                                              - The Oracle
# ============================================================================

