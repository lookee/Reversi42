#  Not too aggressive, not too passive.
#  Not too fast, not too slow.
#  Every concept in harmony.
#  
#  The strongest player is not who wins,
#  But who understands.
#  
#  I am here to teach,
#  Not to destroy.
#  
#  Learn from our games,
#  And you will surpass me.
#  That is enlightenment."
#                        - Zen Master
# 
# Recommended Use:
# - First opponent for new players
# - Training mode with verbose output
# - Understanding Reversi fundamentals
# - Learning AI search concepts
