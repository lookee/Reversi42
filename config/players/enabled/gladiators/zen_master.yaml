# 
# What Beginners Learn:
# - Mobility importance (weight 1.0 visible)
# - Positional value (corners, edges)
# - Stability concepts (permanent discs)
# - Parity principles (move count)
# - Opening theory (book explanations)
# - Search concepts (iterative deepening)
# - Tactical patterns (killer moves)
# 
