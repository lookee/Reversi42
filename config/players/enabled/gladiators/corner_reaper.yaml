# - x_square_penalty: -50 (extreme avoidance)
# - Positional weight 2.0x
# - Slow history decay (remembers positional patterns)
# 
# Famous Patterns:
# - "The Corner Trap": Bait opponent into giving corner
# - "Edge Fortress": Control edges leading to corners
# - "The Reaping": Systematic corner acquisition
# - "Corner Lock": Once taken, corners never fall
# 
# Philosophy:
# "Corners are everything. They are permanence.
