<!-- 
  Epic Players Modal Template - Enhanced Player Selection
  
  This template is loaded dynamically by the main HTML
  Part of Reversi42 WebGUI modular architecture
  
  Features:
  - Detailed player information with avatars
  - Visual stat bars (power, speed, accuracy, depth, lethality)
  - Category-based styling and colors
  - ELO ratings and meta information
  - Smooth animations and hover effects
  - Vertical scrolling for large player lists
-->

  <div id="playersModal" class="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="playersTitle" style="display:none">
    <div class="modalCard" role="document">
      <div class="modalHead" style="background:linear-gradient(135deg, rgba(139,92,246,.15), rgba(59,130,246,.08)); border-bottom:1px solid rgba(139,92,246,.3); padding:18px 24px">
        <div style="flex:1">
          <div id="playersTitle" class="modalTitle" style="font-size:24px; margin-bottom:4px; text-shadow:0 2px 12px rgba(139,92,246,.5)">Select Player</div>
          <div id="playersSubtitle" style="font-size:12px; color:rgba(255,255,255,.6); font-weight:500; letter-spacing:.05em">Choose a gladiator for the arena</div>
        </div>
        <button id="playersCloseBtn" class="btn" title="Close" data-tip="Close" aria-label="Close" style="width:40px; height:40px; display:flex; align-items:center; justify-content:center">
          <span class="icon" aria-hidden="true" style="width:20px; height:20px">
            <svg viewBox="0 0 24 24" style="width:20px; height:20px"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          </span>
        </button>
      </div>
      <div class="modalBody">
        <div id="playersList" class="playersGrid"></div>
      </div>
    </div>
  </div>
