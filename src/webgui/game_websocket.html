<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reversi42 • Board (JSON-driven, Tournament Green)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- CodeMirror for editable JSON -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closebrackets.min.js"></script>
  <style>
    :root{
      --bg:#0b1210; --panel:#10241c; --line:#2b4d3e; --txt:#e8f2eb; --muted:#a5b5a9;
      --accent:#10b981; --accent2:#34d399; --gold:#f4c15d;
      --discW:#f7f9fc; --discB:#0b0f14;
    }
    html,body{
      background:
        radial-gradient(1100px 600px at 100% -10%, rgba(52,211,153,.08), transparent),
        radial-gradient(900px 600px at 0% 110%, rgba(16,185,129,.07), transparent),
        var(--bg);
      color:var(--txt); margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Helvetica Neue,Arial;
    }
    .container{max-width:1160px;margin:0 auto;padding:24px}
    .card{
      background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015));
      border:1px solid rgba(255,255,255,.06); border-radius:16px; overflow:hidden;
      box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 10px 30px rgba(0,0,0,.35);
    }
    .chip{border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04);
          border-radius:999px; padding:.4rem .7rem; display:inline-flex; gap:.45rem; align-items:center}
    .btn{border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05);
         border-radius:10px; padding:.5rem .8rem; cursor:pointer; transition: all 0.2s ease}
    .btn:hover{background:rgba(255,255,255,.08)}
    .btn:disabled{
      opacity: 0.35;
      cursor: not-allowed;
      background: rgba(255,255,255,.02);
      border-color: rgba(255,255,255,.06);
      filter: grayscale(0.3);
    }
    .btn:disabled:hover{
      background: rgba(255,255,255,.02);
    }
    .divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent)}

    /* Avatars */
    .avatar{width:72px;height:72px;border-radius:14px;display:grid;place-items:center;font-weight:900;
            font-size:22px; letter-spacing:.5px;
            color:#e6f6ec;border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 18px rgba(16,185,129,.18)}
    .avatar.b{background:radial-gradient(circle at 35% 35%, #0b9b70, #0a6c4f)}
    .avatar.w{background:radial-gradient(circle at 35% 35%, #9ba7a0, #636f69)}

    /* Board */
    .board{display:grid; grid-template-columns:repeat(8,1fr); gap:4px;
      border:1px solid rgba(255,255,255,.06); border-radius:14px; padding:12px;
      background:linear-gradient(180deg,#1d3c31,#17362b)}
    .cell{position:relative; width:100%}
    .cell::before{content:""; display:block; padding-top:100%}
    .cell-content{position:absolute; inset:0;
      background:linear-gradient(180deg,#255744,#204e3d);
      border:1px solid var(--line); border-radius:10px}

    .disc{position:absolute; inset:12%; border-radius:50%;
      box-shadow:0 0 0 1.5px rgba(255,255,255,.06), 0 10px 20px rgba(0,0,0,.45)}
    .disc.white{background:radial-gradient(circle at 35% 35%, #ffffff, #e7eef7 60%, #cdd7e5)}
    .disc.black{background:radial-gradient(circle at 35% 35%, #2a3531, #0b0f14 65%, #000)}

    .valid{position:absolute; inset:32%; border-radius:999px;
      box-shadow:0 0 0 2px rgba(16,185,129,.85) inset;
      background:radial-gradient(circle, rgba(16,185,129,.28), transparent 60%)}
    .hint{position:absolute; inset:16%; border-radius:999px; border:3px solid var(--gold);
      box-shadow:0 0 20px rgba(244,193,93,.75), 0 0 40px rgba(244,193,93,.25) inset;
      display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--gold);
      background:rgba(0,0,0,.10); font-size:15px; letter-spacing:.02em}

    /* Hoshi */
    .centerMark{position:absolute; left:50%; top:50%; width:clamp(6px,1vw,8px); height:clamp(6px,1vw,8px);
      transform:translate(-50%,-50%); border-radius:999px; pointer-events:none; background: rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.08); box-shadow: inset 0 1px 2px rgba(0,0,0,.45), 0 0 0 2px rgba(0,0,0,.05);
      opacity:.85; z-index:0}

    /* Moves list */
    #movesOl li.active{ color:#e8f2eb; font-weight:700 }
    #movesOl li::marker{ color:var(--muted) }
      /* Compact tournament history (50 moves demo) */
    .historyHead{position:sticky; top:0; z-index:1; background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.03));
      border-bottom:1px solid rgba(255,255,255,.08)}
    .historyGrid{display:grid; grid-template-columns:48px 1fr 1fr}
    .historyRow{display:contents}
    .historyCell{padding:.35rem .5rem; font-variant-numeric:tabular-nums}
    .historyNo{color:var(--muted); text-align:right}
    .historyMove{color:var(--muted); cursor:pointer; text-align:center}
    .historyGrid .historyRow:nth-child(odd) .historyCell{background:rgba(255,255,255,.02)}
    .historyMove:hover{color:var(--txt)}
    .historyMove.active{color:var(--txt); font-weight:700}
.historyMove.last-move{color:var(--accent2); font-weight:700; text-shadow:0 0 8px rgba(52,211,153,.5)}
    .historyBadge{margin-left:.5rem; font-size:11px; color:var(--muted)}
    /* Partial clock styling (safe, minimal) */
    .pclock{font-variant-numeric:tabular-nums}
    .pclock .sep{opacity:.4; padding:0 .25rem}
    .pclock .partial{opacity:.8; font-size:.9em}
    /* Partial clock styling (safe, minimal) */
    .pclock{font-variant-numeric:tabular-nums}
    .pclock .sep{opacity:.4; padding:0 .25rem}
    .pclock .partial{opacity:.8; font-size:.9em}

    /* Board coordinates alignment */
    .coords{color:#c7d5cc; font-size:.78rem; letter-spacing:.08em}

    /* CodeMirror styling */
    .CodeMirror{
      font-family: 'Courier New', monospace;
      font-size: 14px;
      height: auto;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
    }
    .CodeMirror-scroll{
      min-height: 400px;
    }
    .rows-nums{display:grid; grid-template-rows:repeat(8,1fr); gap:4px; align-self:start; margin-top:12px; width:1.6rem; height:auto; justify-self:end; margin-right:-18px}  
    .rows-nums .coords{display:flex; align-items:center; justify-content:flex-end}
    .col-letters{position:absolute; left:0; right:0; top:-22px; display:grid; grid-template-columns:repeat(8,1fr); gap:4px; padding:0 12px; place-items:center; pointer-events:none}
    
    /* AI move highlight animation */
    .ai-move-highlight{
      animation: aiMovePulse 0.6s ease-out;
    }
    @keyframes aiMovePulse {
      0% { 
        background: linear-gradient(180deg, rgba(52, 211, 153, 0.4), rgba(52, 211, 153, 0.2));
        box-shadow: 0 0 20px rgba(52, 211, 153, 0.6);
      }
      50% { 
        background: linear-gradient(180deg, rgba(52, 211, 153, 0.6), rgba(52, 211, 153, 0.4));
        box-shadow: 0 0 30px rgba(52, 211, 153, 0.8);
      }
      100% { 
        background: linear-gradient(180deg, #255744, #204e3d);
        box-shadow: none;
      }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* JSON Editor */
    .json-editor-toggle{
      background:rgba(16,185,129,.1);
      border:1px solid rgba(16,185,129,.3);
      color:#10b981;
      font-weight:500;
      padding:8px 14px;
      font-size:13px;
      border-radius:8px;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap:6px;
      transition:all 0.2s ease;
      white-space:nowrap
    }
    .json-editor-toggle:hover{
      background:rgba(16,185,129,.2);
      border-color:rgba(16,185,129,.5);
      color:#34d399
    }
    .json-editor-toggle span{
      font-size:13px;
      letter-spacing:0.2px
    }
    #jsonEditorWrapper{position:fixed;bottom:0;left:0;right:0;max-height:60vh;overflow:auto;background:var(--panel);border-top:2px solid rgba(255,255,255,.1);padding:0;z-index:999}
    .json-editor-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(0,0,0,.2);border-bottom:1px solid rgba(255,255,255,.1)}
    #jsonEditor{background:#1e1e1e;font-family:'Courier New',monospace;font-size:13px;line-height:1.6}
    code.language-json{font-size:13px}
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="container" style="padding-bottom:0">
    <div class="grid grid-cols-1 md:grid-cols-[1fr_auto_1fr] items-center gap-4 md:gap-8">
      <!-- LEFT: Black -->
      <div class="flex items-center md:items-start justify-start gap-3">
        <div class="avatar b" id="p1Avatar">LA</div>
        <div class="min-w-0">
          <div id="p1Name" class="truncate font-extrabold leading-tight tracking-tight text-2xl md:text-4xl">—</div>
          <div class="flex items-center gap-2 flex-wrap text-[13px]" style="color:var(--muted)">
            <span class="chip"><span style="display:inline-block;width:12px;height:12px;border-radius:999px;background:var(--discB)"></span> Black</span>
            <span id="p1Count" class="chip">● 0</span>
            <span id="p1Delta" class="chip">±0</span>
          </div>
        </div>
      </div>

      <!-- CENTER: Match panel -->
      <div class="flex flex-col items-center text-center gap-1.5">
        <div class="chip text-xs" aria-live="polite">
          <span id="turnDot" style="display:inline-block;width:10px;height:10px;border-radius:999px;background:var(--accent)"></span>
          <span id="turnText">To move: —</span>
        </div>
        <div class="text-xs" style="color:var(--muted)">Move <span id="moveNo">0</span></div>
      </div>

      <!-- RIGHT: White -->
      <div class="flex items-center md:items-start justify-end gap-3">
        <div class="min-w-0 text-right">
          <div id="p2Name" class="truncate font-extrabold leading-tight tracking-tight text-2xl md:text-4xl">—</div>
          <div class="flex items-center gap-2 flex-wrap justify-end text-[13px]" style="color:var(--muted)">
            <span id="p2Count" class="chip">○ 0</span>
            <span id="p2Delta" class="chip">±0</span>
            <span class="chip"><span style="display:inline-block;width:12px;height:12px;border-radius:999px;background:var(--discW)"></span> White</span>
          </div>
        </div>
        <div class="avatar w" id="p2Avatar">AP</div>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">
    <article class="card">
      <div style="padding:18px 22px">
        <div class="grid gap-6 md:grid-cols-[auto_1fr_320px]">
          <!-- Row numbers -->
          <div class="rows-nums">
            <div class="coords" style="text-align:right">1</div><div class="coords" style="text-align:right">2</div>
            <div class="coords" style="text-align:right">3</div><div class="coords" style="text-align:right">4</div>
            <div class="coords" style="text-align:right">5</div><div class="coords" style="text-align:right">6</div>
            <div class="coords" style="text-align:right">7</div><div class="coords" style="text-align:right">8</div>
          </div>

          <!-- Board -->
          <div style="position:relative">
            <div id="board" class="board" role="grid" aria-label="Scacchiera Reversi"></div>
            <div class="col-letters">
              <span class="coords">A</span><span class="coords">B</span><span class="coords">C</span><span class="coords">D</span>
              <span class="coords">E</span><span class="coords">F</span><span class="coords">G</span><span class="coords">H</span>
            </div>
          </div>

          <!-- Right column: history + AI -->
          <aside class="flex flex-col gap-4">
            <div>
              <div class="flex items-center gap-2 mb-2">
                <button id="undoBtn" class="btn" title="Undo" disabled>⟲</button>
                <button id="redoBtn" class="btn" title="Redo" disabled>⟳</button>
                <button id="copyBtn" class="btn" title="Copy moves">⧉</button>
                <button id="saveBtn" class="btn" title="Save JSON" disabled>💾</button>
                <button id="loadBtn" class="btn" title="Load JSON">⤓</button>
                <button id="fsBtn" class="btn" title="Fullscreen">⛶</button>
              </div>
              <div class="text-sm font-semibold mb-2">Move History <span id="histBadge" class="historyBadge hidden">· 50 simulated positions</span></div>
              <div class="card" style="max-height:300px;overflow:auto">
                <div id="histHead" class="historyHead historyGrid text-[12px] hidden">
                  <div class="historyCell historyNo">#</div>
                  <div class="historyCell">Black</div>
                  <div class="historyCell">White</div>
                </div>
                <div id="historyGrid" class="historyGrid text-[14px] hidden"></div>
                <ol id="movesOl" class="list-decimal pl-6 py-2 pr-3 text-[14px]" style="color:var(--muted)"></ol>
              </div>
            </div>
            <div>
              <div class="text-sm font-semibold mb-2"><span id="deepeningSummaryTitle">Notes</span></div>
              <div class="card">
                <div class="p-4 text-[14px] leading-6">
                  <div id="deepeningSummary" class="grid grid-cols-1 gap-2" style="color:var(--muted)">
                    <!-- Popolato da JS: chiave, valore, valore2 (in grigio) -->
                  </div>
                </div>
              </div>
            </div>
          </aside>
        </div>

        <!-- Legend -->
        <div class="flex flex-wrap items-center gap-3 text-[13px]" style="color:var(--muted);margin-top:14px">
          <span class="chip"><span style="display:inline-block;width:12px;height:12px;border-radius:999px;background:var(--discB)"></span>Black Disc</span>
          <span class="chip"><span style="display:inline-block;width:12px;height:12px;border-radius:999px;background:var(--discW)"></span>White Disc</span>
          <span class="chip"><span style="display:inline-block;width:12px;height:12px;border-radius:999px; box-shadow:0 0 0 2px rgba(16,185,129,.85) inset"></span>Valid Move</span>
          <!-- JSON Editor Button -->
          <button class="json-editor-toggle" id="toggleJsonEditor" style="position:relative;bottom:0;right:0;margin-left:auto">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
            </svg>
            <span>JSON Editor</span>
          </button>
        </div>
      </div>
    </article>
  </main>

  <!-- WebSocket connection (no static JSON) -->

  <!-- ======= WebSocket Game Logic ======= -->
  <script>
    'use strict';
    
    // Global variables
    let data = null;
    let ply = 0;
    let wsConnection = null;
    let isHumanTurn = false;
    
    // WebSocket configuration
    const WS_URL = 'ws://localhost:8000/ws';
    const SESSION_ID = 'default';
    
    function loadGameData(gameData){
      data = gameData;
      console.log('Loading game data:', data);

      // Update header
      qs('p1Name').textContent   = data.players?.black?.name || '—';
      qs('p2Name').textContent   = data.players?.white?.name || '—';
      qs('p1Avatar').textContent = data.players?.black?.avatar || initials(data.players?.black?.name);
      qs('p2Avatar').textContent = data.players?.white?.avatar || initials(data.players?.white?.name);
      
      // Update maxPly for calculations
      const maxPly = (data.positions?.length || 1) - 1;

      // Update moves list if exists
      const movesOl = document.getElementById('movesOl');
      if(movesOl && !movesOl.classList.contains('hidden')){
        movesOl.innerHTML = '';
        (data.moves||[]).forEach((m,i)=>{
          const li = document.createElement('li'); li.textContent = m; li.dataset.ply = i+1;
                      li.addEventListener('click', ()=>{ if(data){ ply = i+1; render(); } });
          movesOl.appendChild(li);
        });
      }

      // Re-render with new data
      ply = 0; // Reset to start
      render();
      
      // Update notes if available
      if(data.notes){
        // Update title
        const notesTitle = qs('deepeningSummaryTitle');
        if(notesTitle) {
          notesTitle.textContent = data.players?.white?.name || 'Notes';
        }
        renderNotes(data.notes);
      }
      
      // Rebuild history
      if(window.buildHistory){
        window.buildHistory();
      }
    }
    
    // Build board only once during init
    function buildBoard(){
      const elBoard = document.getElementById('board');
      const coords = ['A1','B1','C1','D1','E1','F1','G1','H1','A2','B2','C2','D2','E2','F2','G2','H2',
                      'A3','B3','C3','D3','E3','F3','G3','H3','A4','B4','C4','D4','E4','F4','G4','H4',
                      'A5','B5','C5','D5','E5','F5','G5','H5','A6','B6','C6','D6','E6','F6','G6','H6',
                      'A7','B7','C7','D7','E7','F7','G7','H7','A8','B8','C8','D8','E8','F8','G8','H8'];
      
      for (let i=0;i<64;i++){
        const cell = document.createElement('div'); 
        cell.className = 'cell';
        cell.dataset.coord = coords[i]; // Store coordinate
        cell.onclick = () => {
          console.log('Cell clicked:', cell.dataset.coord, 'isHumanTurn:', isHumanTurn, 'wsReady:', wsConnection?.readyState === WebSocket.OPEN);
          if(isHumanTurn && wsConnection && wsConnection.readyState === WebSocket.OPEN){
            submitMove(cell.dataset.coord);
          } else {
            console.log('Move rejected - not your turn or WebSocket closed');
          }
        };
        const inner = document.createElement('div'); 
        inner.className = 'cell-content';
        cell.appendChild(inner); 
        elBoard.appendChild(cell);
      }
    }

    // WebSocket functions
    function initWebSocket(){
      wsConnection = new WebSocket(WS_URL);
      
      wsConnection.onopen = () => {
        console.log('WebSocket connected successfully');
        // Send init message
        const initMsg = {
          type: 'init',
          session_id: SESSION_ID,
                          ai_player: 'BLITZ DEMON'
        };
        console.log('Sending init message:', initMsg);
        wsConnection.send(JSON.stringify(initMsg));
      };
      
      wsConnection.onmessage = (event) => {
        console.log('Raw message received:', event.data);
        const message = JSON.parse(event.data);
        console.log('Parsed message:', message);
        handleServerMessage(message);
      };
      
      wsConnection.onclose = () => {
        console.log('WebSocket disconnected, attempting reconnect...');
        setTimeout(initWebSocket, 3000);
      };
      
      wsConnection.onerror = (error) => {
        console.error('WebSocket error:', error);
        console.error('WebSocket readyState:', wsConnection.readyState);
      };
      
      // Log connection attempt
      console.log('Attempting to connect to:', WS_URL);
    }
    
    function handleServerMessage(message){
      console.log('Received:', message.type, message);
      
      switch(message.type){
        case 'board_update':
          // Update board from server
          data = message.data;
          console.log('Board data:', data);
          console.log('Positions:', data.positions);
          console.log('Ply:', ply, 'Positions[0]:', data.positions?.[0]);
          loadGameData(data);
          
          // Update turn indicator
          const turn = data.status?.turn_by_ply?.[0] || 'B';
          isHumanTurn = (turn === 'B');
          console.log('Turn updated:', turn, 'isHumanTurn:', isHumanTurn);
          break;
          
        case 'ai_move':
          console.log(`${data.players.white.name} played:`, message.data.move);
          removeThinkingIconFromPlayerName(); // Remove thinking icon from player name
          // Show AI move animation
          if(message.data.move){
            const moveCoord = message.data.move;
            const moveIdx = coordToIdx(moveCoord);
            const cell = document.getElementById('board')?.children[moveIdx];
            if(cell){
              cell.classList.add('ai-move-highlight');
              setTimeout(() => cell.classList.remove('ai-move-highlight'), 2000);
            }
          }
          // Update notes with AI analysis if available
          if(message.data.evaluation !== undefined || message.data.depth || message.data.move){
            updateAIAnalysis(message.data);
          }
          break;
          
        case 'ai_thinking':
          console.log(message.message);
          // Add thinking icon to AI player name
          addThinkingIconToPlayerName();
          // Don't show the floating message or update notes with thinking status
          break;
          
        case 'error':
          console.error('Server error:', message.message);
          break;
      }
    }
    
    function submitMove(move){
      if(!wsConnection || wsConnection.readyState !== WebSocket.OPEN){
        console.log('Cannot submit move: WebSocket not open');
        return;
      }
      if(!isHumanTurn){
        console.log('Cannot submit move: not human turn. Current isHumanTurn:', isHumanTurn);
        return;
      }
      console.log('Submitting move:', move);
      wsConnection.send(JSON.stringify({
        type: 'human_move',
        move: move
      }));
      console.log('Move submitted, setting isHumanTurn to false');
      isHumanTurn = false; // Prevent double moves
    }
    
    // Initialize on page load
    function init(){
      // Build board once
      buildBoard();
      
      // Setup WebSocket
      initWebSocket();
      
      // Toolbar setup
      setupToolbar();
      
      // History grid setup
      setupHistoryDemo();
      
      // Coord sync setup
      setupCoordSync();
      
      // Keyboard shortcuts
      window.addEventListener('keydown', (e)=>{
        if(!data) return;
        const maxPly = (data?.positions?.length || 1) - 1;
        if(e.key==='ArrowLeft'){ if(ply>0){ ply--; render(); } }
        if(e.key==='ArrowRight'){ if(ply<maxPly){ ply++; render(); } }
      });
    }
    
    // Start when DOM is ready
    window.addEventListener('DOMContentLoaded', init);
    
    function setupHistoryDemo(){
      const histHead = document.getElementById('histHead');
      const histGrid = document.getElementById('historyGrid');
      const histBadge = document.getElementById('histBadge');
      const movesOl = document.getElementById('movesOl');
      
      window.buildHistory = function(){
        if(!data) return;
        if(!histGrid || !histHead) return;
        
        // Read moves from JSON
        const moves = data?.moves || [];
        
        histGrid.innerHTML='';
        
        if(moves.length === 0){
          // Hide history if no moves
          histHead.classList.add('hidden');
          histGrid.classList.add('hidden');
          return;
        }
        
        let rowNo=1;
        const maxPly = (data?.positions?.length || 1) - 1;
        
        // Process moves in pairs (Black, White)
        for(let i=0; i<moves.length; i+=2){
          const b = moves[i] || '';
          const w = moves[i+1] || '';
          
          const row = document.createElement('div'); 
          row.className='historyRow'; 
          row.dataset.row=rowNo;
          
          const cNo = document.createElement('div'); 
          cNo.className='historyCell historyNo'; 
          cNo.textContent=rowNo;
          
          const cB = document.createElement('div'); 
          cB.className='historyCell historyMove'; 
          // Display passed moves as "-"
          cB.textContent = (b.toUpperCase() === 'PASSED' || b === '-') ? '—' : b;
          cB.title = `Move ${rowNo} (Black)`;
          cB.onclick = ()=>{ 
            const targetPly = (rowNo-1)*2 + 1; 
            if(targetPly<=maxPly){ 
              ply = targetPly; 
              render(); 
              highlightDemoRow(rowNo, /*isWhite*/false); 
            } 
          };
          
          const cW = document.createElement('div'); 
          cW.className='historyCell historyMove'; 
          // Display passed moves as "-"
          cW.textContent = (w.toUpperCase() === 'PASSED' || w === '-') ? '—' : w;
          cW.title = `Move ${rowNo} (White)`;
          cW.onclick = ()=>{ 
            const targetPly = (rowNo-1)*2 + 2; 
            if(targetPly<=maxPly){ 
              ply = targetPly; 
              render(); 
              highlightDemoRow(rowNo, /*isWhite*/true); 
            } 
          };
          
          row.appendChild(cNo); 
          row.appendChild(cB); 
          row.appendChild(cW); 
          histGrid.appendChild(row);
          rowNo++;
        }
        
        // Show history grid if there are moves
        histHead.classList.remove('hidden');
        histGrid.classList.remove('hidden');
        movesOl?.classList.add('hidden');
        
        // Highlight only the last move (most recent move)
        highlightLastMove(moves);
      }
      
      function highlightLastMove(moves){
        if(!histGrid || !moves || moves.length === 0) return;
        
        // Clear all active states
        histGrid.querySelectorAll('.historyMove').forEach(n=>n.classList.remove('active', 'last-move'));
        
        // Find the last non-empty move
        let lastNonEmptyIdx = moves.length - 1;
        while(lastNonEmptyIdx >= 0 && (!moves[lastNonEmptyIdx] || moves[lastNonEmptyIdx] === '' || moves[lastNonEmptyIdx] === '-')) {
          lastNonEmptyIdx--;
        }
        
        if(lastNonEmptyIdx >= 0) {
          const rowNo = Math.floor(lastNonEmptyIdx / 2) + 1;
          const isWhite = lastNonEmptyIdx % 2 === 1;
          const row = histGrid.querySelector(`.historyRow[data-row="${rowNo}"]`);
          if(row){ 
            const cell = row.children[isWhite?2:1]; 
            cell?.classList.add('active', 'last-move'); 
            row.scrollIntoView({block:'nearest'}); 
          }
        }
      }
      
      function highlightDemoRow(rowNo, isWhite){
        if(!histGrid) return;
        histGrid.querySelectorAll('.historyMove').forEach(n=>n.classList.remove('active'));
        const row = histGrid.querySelector(`.historyRow[data-row="${rowNo}"]`);
        if(row){ 
          const cell = row.children[isWhite?2:1]; 
          cell?.classList.add('active'); 
          row.scrollIntoView({block:'nearest'}); 
        }
      };
      
      buildHistory();
    }
    
    function setupCoordSync(){
      const rowsNums = document.querySelector('.rows-nums');
      const elBoard = document.getElementById('board');
      
      window.syncRowCoords = function(){
        if(!rowsNums || !elBoard) return;
        const PADDING = 12;
        const innerHeight = Math.max(0, elBoard.clientHeight - (PADDING*2));
        rowsNums.style.height = innerHeight + 'px';
        rowsNums.style.marginTop = PADDING + 'px';
        rowsNums.style.marginRight = '-18px';
      };
      
      window.syncRowCoords();
      const ro = new ResizeObserver(()=> window.syncRowCoords());
      ro.observe(elBoard);
      window.addEventListener('resize', window.syncRowCoords);
    }
    
    function setupToolbar(){
      const undoBtn = qs('undoBtn');
      const redoBtn = qs('redoBtn');
      const copyBtn = qs('copyBtn');
      const saveBtn = qs('saveBtn');
      const loadBtn = qs('loadBtn');
      const fsBtn   = qs('fsBtn');
      const dataScript = document.getElementById('reversi-data');
      // Don't access data here - it might not be loaded yet

      if (undoBtn) undoBtn.addEventListener('click', ()=>{ if(ply>0 && data){ ply--; render(); } });
      if (redoBtn) redoBtn.addEventListener('click', ()=>{ if(data){ const maxPly = (data.positions?.length || 1) - 1; if(ply<maxPly){ ply++; render(); } } });
      if (copyBtn) copyBtn.addEventListener('click', ()=>{ navigator.clipboard?.writeText((data.moves||[]).join(' ')); });
      if (saveBtn) saveBtn.addEventListener('click', ()=>{
        const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'reversi42-match.json'; a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
      });
      if (loadBtn) loadBtn.addEventListener('click', ()=>{
        const inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
        inp.onchange = async ()=>{
          const file = inp.files?.[0]; if(!file) return;
          try{ const next = JSON.parse(await file.text()); dataScript.textContent = JSON.stringify(next); location.reload(); }
          catch(e){ console.error('JSON non valido', e); }
        }; inp.click();
      });
      if (fsBtn) fsBtn.addEventListener('click', ()=>{ if(!document.fullscreenElement){ document.documentElement.requestFullscreen?.(); } else { document.exitFullscreen?.(); } });
    }

    function render(){
      if(!data) {
        console.log('No data to render yet');
        return; // Don't render if data is not loaded
      }
      
      const elBoard = document.getElementById('board');
      const movesOl = document.getElementById('movesOl');
      
      // keep rows numbers aligned after any layout change
      try{ window.syncRowCoords(); }catch(_){}
      const turn = (data.status?.turn_by_ply && data.status.turn_by_ply[ply]) || (ply%2===0 ? 'B':'W');
      // ensure partial resets on jump/undo/redo safely
      if(typeof partial!=='undefined'){
        if(typeof lastTurn==='undefined' || lastTurn===null) lastTurn = turn;
        if(turn !== lastTurn){ partial[turn]=0; lastTurn = turn; }
      }
      qs('turnText').textContent = `To move: ${turn==='B'?'Black':'White'}`;
      qs('turnDot').style.background = (turn==='B') ? 'var(--accent)' : 'var(--accent2)';
      qs('moveNo').textContent = String(Math.ceil(ply/2));

      // Board position
      const s = normalize64(data.positions?.[ply]);
      for(let i=0;i<64;i++){
        const inner = elBoard.children[i].firstElementChild;
        inner.innerHTML='';
        if(s[i]==='B' || s[i]==='W'){
          const d=document.createElement('div'); d.className='disc '+(s[i]==='B'?'black':'white'); inner.appendChild(d);
        }
      }

      // Valid moves
      const vm = (data.valid_by_ply?.[ply]) || [];
      vm.map(coordToIdx).forEach(i=>{
        const dot=document.createElement('div'); dot.className='valid';
        elBoard.children[i].firstElementChild.appendChild(dot);
      });

      // Counts + delta
      const counts = countBW(s); 
      qs('p1Count').textContent = `● ${counts.b}`; 
      qs('p2Count').textContent = `○ ${counts.w}`;
      const adv = counts.b - counts.w; 
      setDelta('p1Delta', adv); 
      setDelta('p2Delta', -adv);

      // highlight (removed ply display) 
      if(movesOl){
        [...movesOl.children].forEach(li=> li.classList.remove('active'));
        if(ply>0){ const li = [...movesOl.children].find(el => +el.dataset.ply === ply); if(li) li.classList.add('active'); }
      }
    }
    
    // Make function globally accessible
    window.reloadGameData = loadGameData;

    // === Utils ===
    function qs(id){ return document.getElementById(id); }
    function idx(r,c){ return r*8 + c; }
    function coordToIdx(coord){ const L='ABCDEFGH'; const c=L.indexOf(String(coord).toUpperCase()[0]); const r=parseInt(String(coord).slice(1),10)-1; return r*8 + c; }
    function initials(name){ return (name||'').trim().split(/\s+/).map(s=>s[0]).join('').slice(0,2).toUpperCase() || '?'; }
    function normalize64(pos){ 
      // Support both formats: string (legacy) and coordinate object (new)
      if(typeof pos === 'string'){
        const raw = (pos||'').trim(); 
        if(raw.length!==64){ 
          const a = Array(64).fill('.'); a[27]='W'; a[28]='B'; a[35]='B'; a[36]='W'; 
          return a; 
        } 
        return raw.split(''); 
      }
      // Convert coordinate object to 64-char array
      if(typeof pos === 'object' && pos !== null){
        const coords = ['A1','B1','C1','D1','E1','F1','G1','H1','A2','B2','C2','D2','E2','F2','G2','H2',
                        'A3','B3','C3','D3','E3','F3','G3','H3','A4','B4','C4','D4','E4','F4','G4','H4',
                        'A5','B5','C5','D5','E5','F5','G5','H5','A6','B6','C6','D6','E6','F6','G6','H6',
                        'A7','B7','C7','D7','E7','F7','G7','H7','A8','B8','C8','D8','E8','F8','G8','H8'];
        return coords.map(coord => pos[coord] || '.');
      }
      // Default fallback
      const a = Array(64).fill('.'); a[27]='W'; a[28]='B'; a[35]='B'; a[36]='W'; 
      return a; 
    }
    function countBW(arr){ let b=0,w=0; for(const ch of arr){ if(ch==='B') b++; else if(ch==='W') w++; } return {b,w}; }
    function msToClock(ms){ const s = Math.max(0, Math.floor(ms/1000)); const m = String(Math.floor(s/60)).padStart(2,'0'); const ss = String(s%60).padStart(2,'0'); return `${m}:${ss}`; }
    function escapeHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function setDelta(id, n){ const el = qs(id); if(!el) return; if(n===0){ el.textContent = '±0'; return; } el.textContent = `${n>0?'+':'−'}${Math.abs(n)}`; }

    // === AI VISUAL FEEDBACK ===
    function updateAIAnalysis(aiData){
      if(!data) return;
      
      // Create dynamic AI analysis notes with all available data
      const aiAnalysis = {
        // Always update title to show AI name
        title: data.players?.white?.name || 'DIVZERO.EXE',
        
        // Basic analysis data
        selected_move: aiData.move || 'Calculating...',
        evaluation: aiData.evaluation !== undefined ? String(aiData.evaluation) : 'Analyzing...',
        depth: aiData.depth !== undefined ? `${aiData.depth} plies` : 'Calculating...',
        
        // Search statistics from engine
        nodes_searched: aiData.nodes_searched !== undefined ? aiData.nodes_searched.toLocaleString() : 'Calculating...',
        nodes_pruned: aiData.nodes_pruned !== undefined ? aiData.nodes_pruned.toLocaleString() : 'Calculating...',
        pruning_ratio: aiData.pruning_ratio !== undefined ? `${(aiData.pruning_ratio * 100).toFixed(1)}%` : 'Calculating...',
        avg_search_time: aiData.avg_search_time || 'Calculating...',
        total_searches: aiData.total_searches !== undefined ? aiData.total_searches : 'Calculating...'
      };
      
      // Update title
      const notesTitle = qs('deepeningSummaryTitle');
      if(notesTitle) {
        notesTitle.textContent = aiAnalysis.title;
      }
      
      // Re-render notes with AI analysis
      renderNotes(aiAnalysis);
      
      // Store for reference
      data.notes = aiAnalysis;
    }
    

    
    function addThinkingIconToPlayerName(){
      // Add rotating icon to p2Name (AI player - white)
      const p2Name = qs('p2Name');
      if(p2Name && !p2Name.querySelector('.thinking-icon')){
        const icon = document.createElement('span');
        icon.className = 'thinking-icon';
        icon.innerHTML = '↻';
        icon.style.cssText = 'display:inline-block;margin-right:8px;animation:spin 1s linear infinite;color:var(--accent2);font-size:1.2em;vertical-align:middle;';
        p2Name.insertBefore(icon, p2Name.firstChild);
      }
    }
    
    function removeThinkingIconFromPlayerName(){
      // Remove rotating icon from p2Name
      const p2Name = qs('p2Name');
      if(p2Name){
        const icon = p2Name.querySelector('.thinking-icon');
        if(icon){
          icon.remove();
        }
      }
    }
    
    // === NOTES RENDERING ===
    function renderNotes(notes){
      const box = qs('deepeningSummary'); 
      if(!box){ return; }
      
      // Filter out the title field and handle the rest
      const notesData = { ...notes };
      const title = notesData.title;
      delete notesData.title;
      
      if(!notesData || Object.keys(notesData).length === 0){ 
        box.innerHTML = '<div class="text-sm" style="color:var(--muted)">No data available.</div>'; 
        return; 
      }
      
      const rows = [];
      for(const [key, valueObj] of Object.entries(notesData)){
        const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        const value = typeof valueObj === 'object' && valueObj !== null ? valueObj.value : valueObj;
        const value2 = typeof valueObj === 'object' && valueObj !== null ? valueObj.value2 : null;
        
        rows.push(`<div class="flex items-center justify-between gap-4">
          <span class="text-[13px]">${escapeHtml(label)}</span>
          <div class="flex items-center gap-2">
            <span class="text-[13px] font-semibold" style="color:var(--txt)">${escapeHtml(String(value))}</span>
            ${value2 ? `<span class="text-[13px]" style="color:var(--muted)">${escapeHtml(String(value2))}</span>` : ''}
          </div>
        </div>`);
      }
      box.innerHTML = rows.join('');
    }
  </script>

  <noscript>
    <div style="position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#10241c;color:#fff;padding:8px 12px;border-radius:8px;border:1px solid #2b4d3e">
      Attiva JavaScript: la pagina mostra solo i dati presenti nel JSON incorporato.
    </div>
  </noscript>



  <!-- JSON Editor Panel -->
  <div id="jsonEditorWrapper" style="display:none">
    <div class="json-editor-header">
      <div class="flex items-center gap-2">
        <span class="font-semibold">JSON Editor</span>
        <span class="chip text-xs" id="jsonStatus">Ready</span>
      </div>
      <div class="flex gap-2">
        <button class="btn text-xs" id="formatJson">✨ Format</button>
        <button class="btn text-xs" id="validateJson">✓ Validate</button>
        <button class="btn text-xs active" id="applyJson">🔄 Apply Changes</button>
        <button class="btn text-xs" id="closeJsonEditor">✕ Close</button>
      </div>
    </div>
    <div id="jsonEditorContainer" style="width:100%;min-height:400px;"></div>
  </div>

  <script>
    // JSON Editor functionality with CodeMirror
    function q(id){ return document.getElementById(id); }
    const toggleBtn = q('toggleJsonEditor');
    const editorWrapper = q('jsonEditorWrapper');
    const jsonEditorContainer = q('jsonEditorContainer');
    const formatBtn = q('formatJson');
    const validateBtn = q('validateJson');
    const applyBtn = q('applyJson');
    const closeBtn = q('closeJsonEditor');
    const jsonStatus = q('jsonStatus');

    let currentData = null;
    let cmEditor = null;

    // Initialize CodeMirror
    function initCodeMirror(initialValue = ''){
      if(!cmEditor && jsonEditorContainer){
        cmEditor = CodeMirror(jsonEditorContainer, {
          value: initialValue,
          mode: {name: 'javascript', json: true},
          theme: 'monokai',
          lineNumbers: true,
          lineWrapping: true,
          matchBrackets: true,
          autoCloseBrackets: true,
          indentUnit: 2,
          tabSize: 2
        });
        
        // Update status on change
        cmEditor.on('change', () => {
          try{
            JSON.parse(cmEditor.getValue());
            updateStatus('Ready', true);
          }catch(e){
            updateStatus('Invalid JSON', false);
          }
        });
      }
    }

    if(toggleBtn) toggleBtn.addEventListener('click', () => {
      const isVisible = editorWrapper.style.display !== 'none';
      editorWrapper.style.display = isVisible ? 'none' : 'block';
      if(!isVisible){
        currentData = JSON.parse(document.getElementById('reversi-data').textContent);
        const jsonStr = JSON.stringify(currentData, null, 2);
        
        // Initialize CodeMirror if not already
        if(!cmEditor){
          initCodeMirror(jsonStr);
        } else {
          cmEditor.setValue(jsonStr);
        }
      }
    });

    if(closeBtn) closeBtn.addEventListener('click', () => {
      editorWrapper.style.display = 'none';
    });



    if(formatBtn) formatBtn.addEventListener('click', () => {
      if(!cmEditor) return;
      try{
        const parsed = JSON.parse(cmEditor.getValue());
        const formatted = JSON.stringify(parsed, null, 2);
        cmEditor.setValue(formatted);
        updateStatus('Formatted', true);
      }catch(e){
        updateStatus('Invalid JSON', false);
      }
    });

    if(validateBtn) validateBtn.addEventListener('click', () => {
      if(!cmEditor) return;
      try{
        JSON.parse(cmEditor.getValue());
        updateStatus('Valid ✓', true);
      }catch(e){
        updateStatus(`Invalid: ${e.message}`, false);
      }
    });

    if(applyBtn) applyBtn.addEventListener('click', () => {
      if(!cmEditor) return;
      try{
        const newData = JSON.parse(cmEditor.getValue());
        
        // Update the embedded JSON
        const dataScript = document.getElementById('reversi-data');
        if(dataScript){
          dataScript.textContent = cmEditor.getValue();
        }
        
        // Re-parse data in the main script
        if(window.reloadGameData){
          window.reloadGameData(newData);
        }
        
        // Close editor
        editorWrapper.style.display = 'none';
        updateStatus('Applied ✓', true);
      }catch(e){
        updateStatus(`Error: ${e.message}`, false);
      }
    });

    function updateStatus(text, isValid){
      jsonStatus.textContent = text;
      jsonStatus.className = 'chip text-xs ' + (isValid ? 'bg-green-500/20 text-green-300' : 'bg-red-500/20 text-red-300');
    }


  </script>
