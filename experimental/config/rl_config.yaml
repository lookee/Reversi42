# RL Player Training Configuration - M1 Optimized
# Optimizations to speed up training on M1 MacBook Pro

training:
  batch_size: 4096              # Increased for M1 (can handle larger batches)
  learning_rate: 0.001
  weight_decay: 1e-4
  optimizer: "AdamW"
  scheduler: "CosineAnnealingLR"
  max_iterations: 1000000
  
mcts:
  simulations: 400               # REDUCED from 800 (2x faster, quality still good)
  c_puct: 1.0
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25
  
self_play:
  use_parallel: true
  num_workers: null             # null = auto-detect
  use_symmetries: true          # Data Augmentation (D8)
  games_per_iteration: 50       # REDUCED from 100 (2x faster per iteration)
  max_moves: 100                # Max moves per game (safety limit)
  temperature: 1.0
  temperature_decay: 0.99
  
replay_buffer:
  capacity: 1000000
  min_size: 5000                # REDUCED from 10000 (starts training sooner)
  
evaluation:
  eval_frequency: 50            # REDUCED from 100 (evaluates more often but faster)
  eval_games: 10                # REDUCED from 20 (faster evaluation)
  win_threshold: 0.55
  
checkpoint:
  save_frequency: 10             # Every 10 iterations
  keep_last_n: 5
  config_save_frequency: 10
  save_config_with_checkpoint: true
